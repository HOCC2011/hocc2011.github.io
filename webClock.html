<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Date & Time Clock</title>
    <!-- Google Font: Fredoka for exact visual match -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            user-select: none;
            overflow: hidden;
            font-family: 'Fredoka', sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
        }

        /* Smooth background and color transitions */
        .theme-transition {
            transition: background-color 1s ease-in-out, background 1s ease-in-out, color 0.8s ease-in-out;
        }
        
        :root {
            --star-size-base: clamp(4rem, min(4vw, 4vh), 4rem);
        }

        /* Morning Sky Theme */
        .theme-morning {
            background: linear-gradient(180deg, #3FCAF7 60%, #7FD7F3 100%);
            color: #ffffff;
        }

        /* Sunset Sky Theme */
        .theme-sunset {
            background: linear-gradient(180deg, #ffab4d 0%, #fe932b 100%);
            color: #fff8eb;
        }

        /* Night Sky Theme */
        .theme-night {
            background: linear-gradient(180deg, #2a5263 0%, #3e6d80 100%);
            color: #e5f3f7;
        }

        /* Floating Cloud Animations */
        @keyframes floatSlow {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(2.5vw); }
        }

        @keyframes floatFast {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(-3.5vw); }
        }

        .animate-cloud-1 {
            animation: floatSlow 18s ease-in-out infinite;
        }

        .animate-cloud-2 {
            animation: floatFast 24s ease-in-out infinite;
        }

        /* Twinkling Star Animation */
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.85); }
            50% { opacity: 1; transform: scale(1.15); }
        }

        .animate-star {
            animation: twinkle 3s ease-in-out infinite;
        }

        /* Soft Glow effect for Sunset Sun */
        .sun-glow {
            background: radial-gradient(circle, rgba(255, 235, 175, 0.45) 0%, rgba(255, 160, 50, 0) 70%);
        }

        /* Responsive cloud sizes */
        #skyContainer .animate-cloud-1 {
            width: clamp(110px, 17vw, 256px) !important;
        }

        #skyContainer .animate-cloud-2 {
            width: clamp(140px, 21vw, 320px) !important;
        }

        #skyContainer .sun-glow {
            width: clamp(8rem, 28vmin, 24rem) !important;
            height: clamp(8rem, 28vmin, 24rem) !important;
            max-width: none;
        }

        /* Clock Display Sizing (Tightened gap via margin-bottom) */
        #dateDisplay {
            font-size: clamp(24px, 4.5vw, 56px) !important;
            line-height: 1.1;
            margin-bottom: clamp(-4px, -0.5vw, 2px) !important; /* Reduced space between date and time */
            max-width: 94vw;
        }

        #timeDisplay {
            font-size: clamp(64px, min(22vw, 30vh), 260px) !important;
            line-height: 0.95;
            white-space: nowrap;
            max-width: 96vw;
        }

        /* Illustration Sizing & Placement */
        #illustrationContainer {
            width: auto;
            max-width: 100%;
            margin-right: clamp(0.5rem, 2.5vw, 2.5rem);
        }

        #illustrationContainer svg {
            display: block;
            width: clamp(9rem, min(32vw, 42vh), 28rem) !important;
            max-width: 100%;
            height: auto;
        }

        #bodyTheme.theme-night #illustrationContainer svg {
            width: clamp(10rem, min(36vw, 48vh), 28rem) !important;
            transform: translateX(72%);
        }

        /* Ground Bar */
        #bodyTheme > div:last-of-type > div:last-child {
            height: clamp(12px, 2.5vh, 56px) !important;
        }

        /* Cloud and Star Helpers */
        #skyContainer > div:not(.sun-glow) {
            max-width: 45vw;
        }

        #bodyTheme.theme-morning #skyContainer > div {
            width: clamp(7rem, 20vw, 20rem);
        }

        #skyContainer svg {
            width: 100% !important;
            height: auto !important;
        }

        #bodyTheme.theme-night #skyContainer > div {
            width: var(--star-size-base) !important;
            height: var(--star-size-base) !important;
        }

        #bodyTheme.theme-night #skyContainer > div.star-small {
            width: calc(var(--star-size-base) * 0.6) !important;
            height: calc(var(--star-size-base) * 0.6) !important;
        }

        #bodyTheme.theme-night #skyContainer > div.star-medium {
            width: var(--star-size-base) !important;
            height: var(--star-size-base) !important;
        }

        #bodyTheme.theme-night #skyContainer > div.star-large {
            width: calc(var(--star-size-base) * 1.4) !important;
            height: calc(var(--star-size-base) * 1.4) !important;
        }

        #bodyTheme.theme-night #skyContainer svg {
            width: 100% !important;
            height: 100% !important;
        }

        /* Mobile / Small Screen Fallbacks */
        @media (max-width: 600px), (max-height: 500px) {
            #dateDisplay {
                font-size: clamp(18px, 5.5vw, 36px) !important;
                margin-bottom: -2px !important;
            }
            #timeDisplay {
                font-size: clamp(52px, 20vw, 120px) !important;
            }
            #illustrationContainer svg {
                width: clamp(6rem, min(27vw, 36vh), 15rem) !important;
            }
            #bodyTheme.theme-night #illustrationContainer svg {
                width: clamp(7rem, min(30vw, 40vh), 17rem) !important;
                transform: translateX(72%);
            }
        }
    </style>
</head>

    <!-- Clock and Theme Management Logic -->
    <script>
        let overrideMode = 'auto'; // 'auto', 'morning', 'sunset', 'night'
        let currentActiveTheme = '';

        function updateClock() {
            const now = new Date();

            // Date formatting: DD/MM/YYYY Day
            const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const dd = String(now.getDate()).padStart(2, '0');
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const yyyy = now.getFullYear();
            const dayStr = dayNames[now.getDay()];

            document.getElementById('dateDisplay').textContent = `${dd}/${mm}/${yyyy} ${dayStr}`;

            // Time formatting: HH:MM
            const hh = String(now.getHours()).padStart(2, '0');
            const min = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('timeDisplay').textContent = `${hh}:${min}`;

            // Determine Theme based on Time or Override
            let themeToApply = overrideMode;
            if (overrideMode === 'auto') {
                const hour = now.getHours();
                if (hour >= 6 && hour < 17) {
                    themeToApply = 'morning';
                } else if (hour >= 17 && hour < 19) {
                    themeToApply = 'sunset';
                } else {
                    themeToApply = 'night';
                }
            }

            if (themeToApply !== currentActiveTheme) {
                applyTheme(themeToApply);
            }
        }

        function applyTheme(theme) {
            currentActiveTheme = theme;
            const body = document.getElementById('bodyTheme');
            const sky = document.getElementById('skyContainer');
            const illustrationContainer = document.getElementById('illustrationContainer');

            // Reset Classes
            body.className = `w-screen h-screen flex flex-col justify-between relative theme-transition theme-${theme}`;

            // Clear Dynamic Layers
            sky.innerHTML = '';
            illustrationContainer.innerHTML = '';

            if (theme === 'morning') {
                // Render Clouds in Sky
                sky.innerHTML = `
                    <div class="absolute top-[8%] left-[5%] w-48 md:w-64 opacity-80 animate-cloud-1">
                        ${document.getElementById('svg-cloud-template').outerHTML}
                    </div>
                    <div class="absolute top-[18%] left-[30%] w-64 md:w-80 opacity-60 animate-cloud-2">
                        ${document.getElementById('svg-cloud-template').outerHTML}
                    </div>
                    <div class="absolute top-[5%] right-[10%] w-56 md:w-72 opacity-75 animate-cloud-1">
                        ${document.getElementById('svg-cloud-template').outerHTML}
                    </div>
                `;
                // Load Morning SVG Illustration
                illustrationContainer.innerHTML = document.getElementById('svg-morning-template').outerHTML;

            } else if (theme === 'sunset') {
                // Render Sun Glow fixed at the top-left corner
                sky.innerHTML = `
                    <div class="fixed top-0 left-0 w-[16rem] h-[16rem] rounded-full sun-glow pointer-events-none"></div>
                `;

                // Load Sunset SVG Illustration
                illustrationContainer.innerHTML = document.getElementById('svg-sunset-template').outerHTML;
            } else if (theme === 'night') {
                // Render Stars scattered across Night Sky
                const starLocations = [
                    { top: '10%', left: '8%', size: 'w-6 h-6', delay: '0s' },
                    { top: '18%', left: '22%', size: 'w-4 h-4', delay: '0.7s' },
                    { top: '8%', left: '36%', size: 'w-7 h-7', delay: '1.2s' },
                    { top: '22%', left: '50%', size: 'w-5 h-5', delay: '0.3s' },
                    { top: '7%', left: '64%', size: 'w-6 h-6', delay: '1.5s' },
                    { top: '19%', left: '78%', size: 'w-4 h-4', delay: '0.9s' },
                    { top: '11%', left: '90%', size: 'w-7 h-7', delay: '0.4s' },
                    { top: '28%', left: '14%', size: 'w-5 h-5', delay: '1.8s' },
                    { top: '30%', left: '85%', size: 'w-6 h-6', delay: '1.1s' }
                ];

                let starsHTML = '';
                const starSVGCode = document.getElementById('svg-star-template').outerHTML;
                starLocations.forEach(star => {
                    starsHTML += `
                        <div class="absolute ${star.size} animate-star" style="top: ${star.top}; left: ${star.left}; animation-delay: ${star.delay}">
                            ${starSVGCode}
                        </div>
                    `;
                });
                sky.innerHTML = starsHTML;

                // Load Night SVG Illustration
                illustrationContainer.innerHTML = document.getElementById('svg-night-template').outerHTML;
            }
        }

        // Initialize clock and timer
        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
